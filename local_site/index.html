<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Local Test Store</title>
</head>
<body style="font-family: Arial; padding: 50px;">

    <h2>Store Login</h2>
    <div id="login-form">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="user_name"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="user_pass"><br><br>

        <button id="loginBtn">Login to Store</button>
    </div>

</body>
</html>
